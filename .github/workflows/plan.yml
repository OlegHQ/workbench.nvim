name: Planning Gates

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate plan and references
        run: python3 scripts/check_plan.py
      - name: Verify rejection cases
        run: python3 -m unittest discover -s tests -p 'test_*.py'
